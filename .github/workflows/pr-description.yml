name: PR description
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Open pull request number to refresh'
        required: true
        type: string
permissions: {}
concurrency:
  group: pr-description-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true
jobs:
  describe:
    # Manual runs must use the default branch's reviewed workflow and helper.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Never use a PR head/base ref or PR-controlled script in this write-capable job.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Update generated description section
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { run } = require('./.github/scripts/pr-description.cjs');
            await run({ github, context, core });
