name: Automation checks
on:
  push:
    paths: ['.github/scripts/**', '.github/workflows/pr-description.yml', '.github/workflows/automation-checks.yml']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/pr-description.yml', '.github/workflows/automation-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automation-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test description generation and API orchestration
        run: node --test .github/scripts/pr-description.test.cjs
