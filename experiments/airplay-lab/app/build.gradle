plugins { id 'com.android.application' }
android {
    namespace 'id.poncol.tvcompanion.airplaylab'
    compileSdk 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'id.poncol.tvcompanion.airplaylab'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-video-feasibility'
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main.assets.srcDirs = ['../.native/notices'] }
    buildTypes { release { minifyEnabled false } }
}
