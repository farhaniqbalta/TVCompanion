plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'id.poncol.tvcompanion.app'
    compileSdk 34
    defaultConfig { applicationId 'id.poncol.tvcompanion'; versionCode 1; versionName '0.1.0-dev'; targetSdk 34; minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { checkDependencies = true }
}
dependencies {
implementation project(':features:smart-home')
implementation project(':features:notifications')
implementation project(':integrations:tuya-lan')
implementation project(':core:designsystem')
implementation project(':core:domain')
}
