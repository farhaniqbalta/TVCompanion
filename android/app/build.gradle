plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'id.poncol.tvcompanion.app'
    compileSdk 34
    ndkVersion '27.2.12479018'
    defaultConfig { applicationId 'id.poncol.tvcompanion'; versionCode 9; versionName '0.5.3-airplay-ui-preview'; targetSdk 34; minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { checkDependencies = true }
}
dependencies {
implementation project(':features:airplay')
implementation project(':integrations:airplay-runtime')
implementation project(':integrations:uxplay-native')
implementation project(':features:smart-home')
implementation project(':features:notifications')
implementation project(':integrations:tuya-lan')
implementation project(':core:designsystem')
implementation project(':core:domain')
}
