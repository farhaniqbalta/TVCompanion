pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith('com.android.')) useModule("com.android.tools.build:gradle:${requested.version}")
            if (requested.id.id.startsWith('org.jetbrains.kotlin.')) useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${requested.version}")
        }
    }
}
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'TVCompanion'
include ':features:airplay', ':ipc:airplay-contract', ':integrations:airplay-runtime', ':integrations:uxplay-native'
include ':app', ':core:domain', ':core:designsystem', ':integrations:tuya-lan', ':features:smart-home', ':features:notifications'

// Explicit opt-in only: never part of the production app or default CI build.
if (providers.gradleProperty('airplayLab').orNull == 'true') {
    include ':experiments:airplay-lab'
    project(':experiments:airplay-lab').projectDir = file('../experiments/airplay-lab/app')
}
